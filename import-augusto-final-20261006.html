const norm=s=>String(s||"").replace(/\s+/g," ").trim().toLowerCase();
function hashText(s){let h=2166136261;for(const ch of norm(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
(async()=>{
  const status=document.getElementById("status");
  try{
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    const db=firebase.firestore();
    const manifest=await fetch("data/ruinas-dos-ceus.json",{cache:"no-cache"}).then(r=>r.json());
    const chapters=new Map(manifest.chapters.map(c=>[Number(c.n),c]));
    const paraCache=new Map();
    let created=0,skipped=0;
    const details=[];
    for(const x of ITEMS){
      if(!paraCache.has(x.chapter)){
        const ch=chapters.get(x.chapter);
        if(!ch) throw new Error("Capítulo ausente: "+x.chapter);
        const raw=await fetch(ch.text,{cache:"no-cache"}).then(r=>r.text());
        paraCache.set(x.chapter,raw.replace(/\r\n/g,"\n").trim().split(/\n{2,}/).filter(Boolean));
      }
      const paras=paraCache.get(x.chapter);
      const paragraph=paras[x.paraIdx];
      if(paragraph==null) throw new Error("Parágrafo ausente: cap "+x.chapter+" idx "+x.paraIdx);
      const q=norm(paragraph);
      const ref=db.collection("comments").doc("augusto-word-test3-"+x.id);
      const old=await ref.get();
      if(old.exists){skipped++;details.push("skip "+x.id);continue;}
      const t=Date.parse(x.date);
      await ref.set({
        kind:"comment",
        bookId:"ruinas-dos-ceus",
        chapter:x.chapter,
        paraIdx:x.paraIdx,
        paragraphKey:"p_"+hashText(q),
        quote:q.slice(0,220),
        author:"Augusto Albuquerque",
        authorId:"augusto-word-test3-2026",
        role:"reader",
        text:x.text,
        status:"open",
        adminSeen:false,
        at:t,
        updatedAt:t
      });
      created++;details.push("ok "+x.id+" c"+x.chapter+" p"+x.paraIdx);
    }
    status.textContent="IMPORT_OK created="+created+" skipped="+skipped+"\n"+details.join("\n");
    document.title="IMPORT_OK "+created+"/"+ITEMS.length;
  }catch(e){
    status.textContent="IMPORT_ERROR "+(e&&e.stack||e);
    document.title="IMPORT_ERROR";
  }
})();
