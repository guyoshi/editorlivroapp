":"p_dr1wo2","quote":"— melhor qualidade de um aprendiz — disse o homem, piscando. — entrem, entrem. o vento tá bom pra chá de raiz e histórias tortas.","text":"Este me lembrou de minha falecida avó. Uma lembrança muito boa","at":1790703540000},{"id":"augusto-word-test3-12","chapter":4,"paraIdx":20,"paragraphKey":"p_vlubj2","quote":"professor taliver era um dos cientistas mais respeitados da câmara das correntes e dedicara muitos ciclos ao estudo das nuvens, dos ventos, das estrelas e do comportamento atmosférico de etérea. na juventude, também fora","text":"Novamente, mais um importante parágrafo, explicando os personagens.","at":1790703660000},{"id":"augusto-word-test3-14","chapter":4,"paraIdx":115,"paragraphKey":"p_1b6axcs","quote":"“quando os ventos descansarem…","text":"Quando eu li isso... me veio uma espécie de clichê, muito presente em outras obras.","at":1790704260000},{"id":"augusto-word-test3-16","chapter":5,"paraIdx":53,"paragraphKey":"p_eqloqb","quote":"— você fala muito do seu pai... — disse ele, hesitante. — é como se ele ainda estivesse aqui.","text":"O capítllo 5, eu não tive nenhum comentário específico, porque achei um capítulo bem leve... e pro final dele foi dando uma \"emocionada\" com uma pitada de mistério... é um bom capítulo.O que eu estou gostando muito, é que vc criou um universo, cheio de nomes e isso é muito raro hj em dia.","at":1790720520000},{"id":"augusto-word-test3-1518970428","chapter":6,"paraIdx":0,"paragraphKey":"p_6x9tej","quote":"a alvorada seguinte chegou com um céu encoberto por tons de cinza amarelado. jokara se levantou antes da irmã, vestiu um manto discreto de cor terrosa, e saiu de casa sem fazer ruído. o vento voltara a soprar, ora de um ","text":"Isso é perigoso, Jokara! (Mas eu já sabia que irias fazer isso)","at":1790977259000},{"id":"augusto-word-test3-951275745","chapter":6,"paraIdx":33,"paragraphKey":"p_8go13h","quote":"mirel mexia uma infusão quente feita de flores de cerco, os olhos marcados pelo cansaço dos que oram mais do que dormem, mas ainda assim acolhedores. sobre a mesa, limpava uma pequena ave caída do ninho, com gestos lento","text":"Aqui me lembrou uma cidade de interior, com pessoas mais simples. Essa simplicidade que faz bem pra vida.","at":1790977530000},{"id":"augusto-word-test3-1191541659","chapter":6,"paraIdx":61,"paragraphKey":"p_qd9cij","quote":"as pernas e os ombros estavam bem. o peso vinha de outro lugar. corria pior, ria menos e sua vintela já não subia como antes. então percebeu pedras nos bolsos. tirava uma, outra aparecia. tirava duas, surgiam três.","text":"Caraca... isso aqui parece muito com uma crise de ansiedade ou depressão... é algo profundo que nos faz refletir","at":1790977685000},{"id":"augusto-word-test3-168941424","chapter":6,"paraIdx":177,"paragraphKey":"p_1v9a2nz","quote":"o livro, à frente dela, tinha se fechado sozinho. jokara olhou para a perna. viu o osso, branco, entre a carne aberta.","text":"Meu Deus!","at":1790978555000},{"id":"augusto-word-test3-2122632445","chapter":7,"paraIdx":69,"paragraphKey":"p_1o9ukuh","quote":"eram textos antigos, enrolados em fibras e guardados como relíquias. muitos deles eram lidos apenas por oradores ou anciãos, mas ela sempre fora curiosa, e sua irmã a ajudara a conseguir acesso ao acervo mais profundo. p","text":"É uma ótima teoria!","at":1791038170000},{"id":"augusto-word-test3-1588761645","chapter":7,"paraIdx":85,"paragraphKey":"p_1y3gs03","quote":"— não. você foi procurar uma resposta. como nas histórias. as heroínas dos contos sempre perdem alguma coisa... mas sempre acham outra.","text":"Liri, nós te amamos!","at":1791038251000},{"id":"augusto-word-test3-1166708332","chapter":7,"paraIdx":157,"paragraphKey":"p_sr1rlx","quote":"“eles não vão te ouvir.”","text":"Oxi! (Estou intrigado)Final do capítulo 7. Eu diria ser um bom capítulo... mais 1 capítulo de transição, como se tivesse transitando pra algo... ainda sim, em alguns momentos me deu certa \"dor\" por conta da situação de Jokara.","at":1791039595000},{"id":"augusto-word-test3-821268273","chapter":8,"paraIdx":73,"paragraphKey":"p_1ee8txk","quote":"— juntas... — ele baixou a voz. — o tempo de queda aumenta. o peso aumenta. o ar fica mais ralo. os ventos mudam de direção ou param. se eu estiver certo, tudo isso tem a mesma causa.","text":"Aqui foi um parágrafo chave. Porque mostra que a Jokara não está errada. Nao está louca. E isso aumenta e contribui muito pra história","at":1791071959000},{"id":"augusto-word-test3-598142964","chapter":8,"paraIdx":102,"paragraphKey":"p_137efl3","quote":"taliver deu dois passos para fora e parou tão de repente que jokara quase esbarrou nele. uma das luas permanecia clara entre as estrelas. a outra ainda estava lá também, mas alguma coisa parecia ter avançado sobre sua fa","text":"Ohhh... eu não sabia que tinham duas luas... que massa!","at":1791072765000},{"id":"augusto-word-test3-1557295205","chapter":8,"paraIdx":197,"paragraphKey":"p_oyiuqz","quote":"o barulho era ensurdecedor. atrás deles, o meio da ilha começou a ceder. árvores se inclinavam devagar. o chão rachava em várias direções, e um pedaço inteiro da encosta se desprendeu.","text":"Isso aqui me lembrou aqueles filmes de catástrofes mundiais... e que eu gosto muito.","at":1791073144000},{"id":"augusto-word-test3-1017465543","chapter":8,"paraIdx":205,"paragraphKey":"p_qx6bjv","quote":"o chão sob eles estremeceu de novo.","text":"O capítulo 8... eu diria que é um capítulo muito... intenso, acho que seria a palavra. E não a intensidade de ter acontecido grandes coisas sabe... mas acho que os diálogos foram muito intensos. Eu gostei bastante","at":1791073233000},{"id":"augusto-word-test3-1841586685","chapter":9,"paraIdx":174,"paragraphKey":"p_1n5nbd0","quote":"o impacto veio como gelo. jokara atingiu a água, e o frio lhe arrancou o ar dos pulmões. os sons se calaram. bolhas. escuro. ela afundava.","text":"O capítulo 9, eu não comentei nada, de tão tenso q eu fiquei. O mundo todo destruindo. Eu me conectei com as pessoas de todas as formas. Cara, muito intenso. Eu to todo arrepiado aqui. Cara... Poha. Que capítulo incrível! O melhor até aqui.","at":1791074394000},{"id":"augusto-word-test3-773950422","chapter":10,"paraIdx":84,"paragraphKey":"p_nbhran","quote":"adormeceu ao lado do menino, com o fogo baixo. não havia vento nenhum.","text":"O capítulo 10, como eu posso resumir minha experiência... foi tenso demais. E preocupante. EU fiquei tensionado, com sede, preocupado, tensionado... se o objetivo era deixar os leitores tensos, você conseguiu.","at":1791142005000},{"id":"augusto-word-test3-1518044976","chapter":11,"paraIdx":2,"paragraphKey":"p_1x0xqm3","quote":"por vezes, um animal menor se deixava surpreender: uma criatura de pelo áspero, patas curtas e duas antenas finas que vibravam no ar, farejando o ambiente. numa dessas caçadas, loutes aproximou-se demais. a criatura crav","text":"Este menino é um verdadeiro mistério","at":1791142252000},{"id":"augusto-word-test3-1219731782","chapter":11,"paraIdx":9,"paragraphKey":"p_16x2h0r","quote":"não encontrou ninguém vivo.","text":"Tenso demais.","at":1791142333000},{"id":"augusto-word-test3-1266112241","chapter":11,"paraIdx":29,"paragraphKey":"p_gv8gh7","quote":"aos pés da montanha, tomou uma decisão. era hora de construir, de criar abrigo contra a hostilidade do chão. com loutes ao lado, começou a erguer uma estrutura simples: galhos entrelaçados em círculo, raízes fincadas no ","text":"O bom, é que esse capítulo mostra a sobrevivência dos dois. E jokara, apesar de tudo, tem muitos conhecimentos sobre. E isso é muito bom pra história em si. Essa parte de sobrevivência é essencial, e aqui tá bem descrita, cheio de detalhes precisos e essenciais. Aqui não foi um abuso as descrições, elas serviram muito bem. Eu acho inclusive que em alguns casos, pode ser até mais descrito, principalmente com relação as novas criaturas.","at":1791142667000},{"id":"augusto-word-test3-1191188138","chapter":11,"paraIdx":31,"paragraphKey":"p_qdl3r6","quote":"outro sopro, na tentativa de alcançar frutos escondidos no alto, jokara tentou escalar uma árvore colossal. as raízes serviam de degraus, mas o coto latejava e os dedos escorregaram. foi loutes quem a agarrou pelo braço ","text":"Loutes tem sido uma criança especial... especial até demais... ai tem","at":1791142988000},{"id":"augusto-word-test3-311327034","chapter":11,"paraIdx":48,"paragraphKey":"p_ilwr4","quote":"sopros depois, jokara e loutes prepararam uma armadilha simples, cordas improvisadas com raízes e pedras posicionadas. pela manhã, encontraram o chão revirado: a presa fugira, e a armadilha estava despedaçada. só havia m","text":"coitada... ela ta enlouquecendo já.","at":1791143476000},{"id":"augusto-word-test3-232982344","chapter":13,"paraIdx":179,"paragraphKey":"p_9fplnl","quote":"jokara sorriu. tocou-lhe o ombro.","text":"O capítulo 13... eu o li sem comentar, porque estava compenetrado na leitura. Fiquei aliviado que Jokara encontrou a irmã, e que podia ter ciúmes, porque pelo menos ela está viva. Foi um capítulo ótimo novamente. Pra falar a verdade, estou me tornando repetitivo. A história é boa, não é mais leve, é intensa. Cada capítulo traz mais coisas interessantes, cada diálogo deixa o leitor com fome por ler mais. Creio que se meu tempo fosse melhor, eu leria o livro num único dia.","at":1791146517000},{"id":"augusto-word-test3-1094301673","chapter":14,"paraIdx":142,"paragraphKey":"p_qj88nt","quote":"todos se entreolharam. jokara apertou o bastão nas mãos. nestira levou as mãos à boca. loutes não se moveu, mas seus olhos brilharam ao refletir a chama.","text":"O capitulo 14, é bem mais curto. Porém é preciso. Eu me senti mais \"aliviado\". Digo, foi um capítulo mais de calmaria. Eu creio que isso foi proposital. E um proposital certo e bom. Dando uma sensação de respirar mais e melhor, depois de alguns capítulos mais caóticos e tensos. Isso é muito bom.","at":1791148889000},{"id":"augusto-word-test3-921320512","chapter":15,"paraIdx":219,"paragraphKey":"p_cqtf54","quote":"o fogo baixou até as brasas. platisa continuava de costas, o zélon apertado contra o peito. mariv estava de olhos abertos, olhando o escuro. do lado de gabasteri, a respiração não era de quem dormia.","text":"O capítulo 15, se pudesse ser definido em uma frase, seria \"odeio Gabasteri\". É um tipo de personagem chato de RPGs, pode ser preciso, mas é enjoado. Parece que sabe de tudo, é um líder, por ele mesmo achar que é.O li de início ao fim... não teve algo que eu achei que precisasse comentar. Não tem nenhum erro ou algo do tipo. Mas é um capítulo que, na minha opinião, muitos vão odiar Gabasteri kk","at":1791151081000},{"id":"augusto-word-test3-1741620009","chapter":16,"paraIdx":154,"paragraphKey":"p_1xam1yd","quote":"o grupo voltou-se para a fogueira e para a comida simples que tinham em mãos. gabasteri ficou um pouco afastado, olhando para o fogo enquanto os outros começavam a discutir o que fariam no sopro seguinte.","text":"Capítulo 16... Maletar, \"que homem\". Este sim é um líder digno. Posso me arrepender no futuro, mas agora confio 100% nele. Este capítulo me lembrou um grupo de RPG. Cada um com sua personalidade e todos lutando para se conhecerem e \"darem certo\".A história tem me lembrado muito minhas narrativas de RPGs de mesa. Principalmente os que possuem fantasia.","at":1791151199000},{"id":"augusto-word-test3-1435241794","chapter":17,"paraIdx":1,"paragraphKey":"p_11k7d39","quote":"o teto continuava de pé por causa de maletar, embora não tivesse ficado de pé na primeira tentativa. acostumado à madeira viva de etérea, ele havia montado as primeiras junções esperando que os galhos cedessem sob tensão","text":"Se maletar tivesse uma profissão, seria de carpinteiro.","at":1791151320000},{"id":"augusto-word-test3-1890461159","chapter":17,"paraIdx":59,"paragraphKey":"p_1bj4f76","quote":"— claro — disse, suave. — caçaremos juntos, então.","text":"Não me surpreenderia se Gabasteri matasse Maletar e corresse até todos e falaria que foi um acidente.","at":1791151571000},{"id":"augusto-word-test3-879477294","chapter":17,"paraIdx":120,"paragraphKey":"p_1pd7rsp","quote":"— ela te ama muito — disse mariv. — e eu… também a amo.","text":"Um romance! Era disso que a história precisava!","at":1791151975000},{"id":"augusto-word-test3-792361237","chapter":17,"paraIdx":160,"paragraphKey":"p_1kvxzvw","quote":"o silêncio, agora, era outro: mais fácil, menos áspero. remexeram as lanças e voltaram à pesca.","text":"Capítulo 17, eu diria um capítulo mais \"fofo\". Eu gostei muito. Gosto muito de romances e isso vai agregar muito na história!","at":1791152023000},{"id":"augusto-word-test3-1958477094","chapter":18,"paraIdx":54,"paragraphKey":"p_sxlslz","quote":"o animal rompeu a armadilha, baixou os chifres e disparou pela abertura. nestira tentou sair da frente, mas o barro prendeu seu pé por uma fração de segundo. foi o bastante. o impacto a arrancou do chão e a lançou contra","text":"Isso deve ter doído!","at":1791153314000},{"id":"augusto-word-test3-1041576535","chapter":18,"paraIdx":98,"paragraphKey":"p_1va97gf","quote":"— estranho. a comida ter desaparecido assim… será que alguém pode ter escondido em outro lugar? — sugeriu gabasteri, baixo. olhou para cada um. — talvez por… precaução.","text":"Certeza que foi Gabasteri!","at":1791153424000},{"id":"augusto-word-test3-1533472553","chapter":18,"paraIdx":229,"paragraphKey":"p_1owlbzz","quote":"— e eu daria qualquer coisa para ter escolhido um único sim a mais com ari.","text":"A história de pai e filha me emocionou de verdade e me levou a refletir. Os pais, muitas das vezes escolhem dizer sim aos seus filhos, mesmo que estejam cansados. Não sei explicar, mas mexeu comigo profundamente.","at":1791153958000}];
