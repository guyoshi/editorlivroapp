<!doctype html><meta charset="utf-8"><title>Comment snapshot</title><pre id="s">starting</pre>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script>
(async()=>{
 const el=document.getElementById("s");
 try{
  if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
  const snap=await firebase.firestore().collection("comments").where("bookId","==","ruinas-dos-ceus").get();
  const chapters=new Set([6,15,21,24]);
  const rows=[];
  snap.forEach(doc=>{const d=doc.data();if(chapters.has(Number(d.chapter)))rows.push({id:doc.id,kind:d.kind||"",chapter:Number(d.chapter),paraIdx:Number(d.paraIdx),paragraphKey:d.paragraphKey??null,quote:d.quote??"",text:d.text??"",emoji:d.emoji??"",author:d.author??""});});
  rows.sort((a,b)=>a.chapter-b.chapter||a.paraIdx-b.paraIdx||a.id.localeCompare(b.id));
  el.textContent=JSON.stringify(rows);
  document.title="SNAP_OK "+rows.length;
 }catch(e){el.textContent="SNAP_ERROR "+(e&&e.stack||e);document.title="SNAP_ERROR";}
})();
</script>
