<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Livros — Leitor</title>
<meta name="description" content="Leitor e narrador dos seus livros">
<meta name="theme-color" content="#faf6ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="app">

  <!-- BIBLIOTECA -->
  <section id="view-library" class="view" data-view>
    <header class="topbar">
      <h1 class="brand">Meus Livros</h1>
      <button id="btnSettings" class="icon-btn" title="Ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3a7.9 7.9 0 00-.14-1.5l2.07-1.6a.5.5 0 00.12-.65l-2-3.4a.5.5 0 00-.6-.22l-2.43 1a8 8 0 00-1.3-.75l-.37-2.6a.5.5 0 00-.5-.42h-4a.5.5 0 00-.5.42l-.37 2.6a8 8 0 00-1.3.75l-2.43-1a.5.5 0 00-.6.22l-2 3.4a.5.5 0 00.12.65l2.07 1.6a8 8 0 000 3l-2.07 1.6a.5.5 0 00-.12.65l2 3.4a.5.5 0 00.6.22l2.43-1c.4.3.84.55 1.3.75l.37 2.6a.5.5 0 00.5.42h4a.5.5 0 00.5-.42l.37-2.6c.46-.2.9-.45 1.3-.75l2.43 1a.5.5 0 00.6-.22l2-3.4a.5.5 0 00-.12-.65l-2.07-1.6c.09-.49.14-.99.14-1.5z"/></svg>
      </button>
    </header>
    <p class="brand-sub">Biblioteca</p>

    <div id="bookList" class="book-list"></div>
  </section>

  <!-- CAPÍTULOS DE UM LIVRO -->
  <section id="view-book" class="view" data-view hidden>
    <header class="topbar">
      <button class="icon-btn" data-back="library" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 4.5L8 12l7.5 7.5 1.4-1.4L10.8 12l6.1-6.1z"/></svg>
      </button>
      <h1 id="bookTitle" class="brand small"></h1>
      <span class="spacer"></span>
    </header>
    <p id="bookSubtitle" class="brand-sub"></p>
    <p id="bookProgress" class="book-progress-line"></p>
    <div id="chapterList" class="chapter-list"></div>
  </section>

  <!-- LEITURA / PLAYER -->
  <section id="view-reader" class="view" data-view hidden>
    <header class="topbar reader-topbar">
      <button class="icon-btn" data-back="book" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 4.5L8 12l7.5 7.5 1.4-1.4L10.8 12l6.1-6.1z"/></svg>
      </button>
      <div class="reader-heading">
        <span id="readerBook" class="reader-book"></span>
        <span id="readerChapter" class="reader-chapter"></span>
      </div>
      <button id="btnNextChapterTop" class="icon-btn" title="Próximo capítulo" aria-label="Próximo capítulo">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M5 4l10 8-10 8V4zm12 0h2v16h-2V4z"/></svg>
      </button>
      <button id="btnFocus" class="icon-btn" title="Modo foco" aria-label="Modo foco">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 9V4h5v2H6v3H4zm10-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/></svg>
      </button>
    </header>

    <div id="readerProgress" class="reader-progress">
      <div id="readerProgressFill" class="reader-progress-fill"></div>
      <span id="readerProgressLabel" class="reader-progress-label">0%</span>
    </div>

    <div id="readerScroll" class="reader-scroll">
      <div id="chapterNotes" class="chapter-notes" hidden></div>
      <article id="chapterText" class="chapter-text"></article>

      <div class="chapter-complete-area">
        <button id="btnCompleteChapter" class="complete-btn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1.3 14.8l-4.5-4.5 1.4-1.4 3.1 3.1 6.2-6.2 1.4 1.4z"/></svg>
          <span id="completeBtnLabel">Concluir capítulo</span>
        </button>
        <p id="bookProgressEnd" class="book-progress-end"></p>
      </div>

      <button id="btnNextChapterEnd" class="next-chapter-btn" hidden>
        <span id="nextChapterLabel">Próximo capítulo</span>
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </button>
    </div>

    <button id="focusExit" class="focus-exit" hidden aria-label="Sair do modo foco">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.7l-1.42-1.42L9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z"/></svg>
    </button>

    <!-- barra do player de áudio -->
    <div id="playerBar" class="player-bar" hidden>
      <button id="btnPlay" class="play-btn" aria-label="Tocar">
        <svg id="iconPlay" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="22" height="22" hidden><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div class="player-mid">
        <div class="player-times">
          <span id="timeCurrent">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
        <input id="seek" type="range" min="0" max="1000" value="0" class="seek">
      </div>
      <button id="btnBack15" class="icon-btn small" aria-label="Voltar 15s">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button id="btnAmbient" class="icon-btn small ambient-btn" aria-label="Música de fundo" title="Música de fundo">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3v10.55A4 4 0 1014 17V7h4V3z"/></svg>
      </button>
    </div>
  </section>

  <!-- AJUSTES -->
  <div id="settingsSheet" class="sheet" hidden>
    <div class="sheet-card">
      <h2>Ajustes</h2>
      <label class="field">
        <span>Seu nome (aparece nos seus comentários)</span>
        <input id="cfgName" type="text" placeholder="ex.: Gui" maxlength="40">
      </label>
      <p class="sheet-hint">Se o conteúdo estiver em outro lugar (ex.: outro repositório no GitHub), ajuste o endereço base abaixo. Deixe em branco para usar os arquivos deste mesmo site.</p>
      <label class="field">
        <span>Base do conteúdo (URL)</span>
        <input id="cfgBase" type="text" placeholder="ex.: https://raw.githubusercontent.com/usuario/repo/main/">
      </label>

      <div id="adminBox" class="admin-box" hidden>
        <label class="field-check">
          <input id="cfgShowAll" type="checkbox">
          <span>Mostrar os comentários de todo mundo pra todo mundo</span>
        </label>
      </div>
      <button id="btnAdminToggle" class="link-btn">Modo admin</button>

      <div class="sheet-actions">
        <button id="cfgSave" class="btn-primary">Salvar</button>
        <button id="cfgClose" class="btn-ghost">Fechar</button>
      </div>
    </div>
  </div>

  <!-- NOME (primeira vez) -->
  <div id="nameSheet" class="sheet" hidden>
    <div class="sheet-card">
      <h2>Como podemos te chamar?</h2>
      <p class="sheet-hint">Seu nome aparece nos comentários que você deixar nos capítulos.</p>
      <label class="field">
        <span>Seu nome</span>
        <input id="nameInput" type="text" placeholder="ex.: Gui" maxlength="40">
      </label>
      <div class="sheet-actions">
        <button id="nameSave" class="btn-primary">Começar a ler</button>
      </div>
    </div>
  </div>

</div>

<audio id="audioEl" preload="metadata"></audio>
<audio id="ambientEl" preload="none" loop></audio>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/comments.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
